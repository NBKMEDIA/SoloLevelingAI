<!-- VIP Subscription Payment Modal -->
<div id="paymentModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closePaymentModal()">&times;</span>
    
    <h2>👑 VIP Subscription (No Ads)</h2>
    <p class="sub-title">Scan QR code using any UPI app to complete payment</p>
    
    <!-- QR Code Section -->
    <div class="qr-container">
      <img src="YOUR_QR_CODE_IMAGE_PATH.png" alt="Payment QR Code" id="paymentQrCode">
      <p class="payee-name">Accepting payments via PhonePe, Google Pay, Paytm & BHIM</p>
    </div>

    <!-- UPI ID Copy Section -->
    <div class="upi-copy-box">
      <span>UPI ID: <strong id="upiIdText">yourname@upi</strong></span>
      <button onclick="copyUpiId()" class="btn-copy">Copy UPI</button>
    </div>

    <hr class="divider">

    <!-- Payment Verification Form -->
    <form id="paymentVerifyForm" onsubmit="submitPaymentVerification(event)">
      <label for="utrNumber">Enter 12-Digit Transaction / UTR ID:</label>
      <input 
        type="text" 
        id="utrNumber" 
        name="utrNumber" 
        placeholder="e.g. 423456789012" 
        required 
        pattern="[0-9]{12}" 
        title="Please enter a valid 12-digit UTR/Transaction number"
      >
      <button type="submit" class="btn-submit">Submit for Verification</button>
    </form>
  </div>
</div>

<style>
  .modal {
    display: flex;
    justify-content: center;
    align-items: center;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: rgba(0, 0, 0, 0.85);
    font-family: Arial, sans-serif;
  }
  .modal-content {
    background: #18181c;
    color: #ffffff;
    padding: 24px;
    border-radius: 16px;
    width: 90%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    position: relative;
  }
  .close-btn {
    position: absolute;
    top: 12px; right: 16px;
    font-size: 24px;
    cursor: pointer;
    color: #aaaaaa;
  }
  .sub-title {
    font-size: 13px;
    color: #bbbbbb;
    margin-bottom: 16px;
  }
  .qr-container img {
    width: 220px;
    height: 220px;
    border-radius: 12px;
    border: 2px solid #333;
  }
  .payee-name {
    font-size: 12px;
    color: #888888;
    margin: 8px 0 16px;
  }
  .upi-copy-box {
    background: #25252b;
    padding: 10px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
  }
  .btn-copy {
    background: #673ab7;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  .divider {
    border: 0;
    height: 1px;
    background: #333;
    margin: 20px 0;
  }
  #paymentVerifyForm label {
    display: block;
    font-size: 13px;
    margin-bottom: 8px;
    text-align: left;
    color: #dddddd;
  }
  #paymentVerifyForm input {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #0f0f12;
    color: #fff;
    box-sizing: border-box;
    margin-bottom: 12px;
  }
  .btn-submit {
    width: 100%;
    background: #4caf50;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
  }
</style>

<script>
  function copyUpiId() {
    const upiText = document.getElementById("upiIdText").innerText;
    navigator.clipboard.writeText(upiText);
    alert("UPI ID Copied: " + upiText);
  }

  function closePaymentModal() {
    document.getElementById("paymentModal").style.display = "none";
  }

  function submitPaymentVerification(event) {
    event.preventDefault();
    const utr = document.getElementById("utrNumber").value;
    alert("Payment submitted for verification. UTR: " + utr);
    closePaymentModal();
  }
</script>
